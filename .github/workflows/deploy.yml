name: Build and Deploy

on:
  push:
    branches:
      - main
      - release-*

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy-environment: ${{ steps.determine-environment.outputs.deploy-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine deploy environment
        id: determine-environment
        run: |
          branch="${GITHUB_REF_NAME}"
          if [[ "$branch" == "main" ]]; then
            env_name="dev"
          elif [[ "$branch" == release-* ]]; then
            env_name="prod"
          else
            env_name="dev"
          fi
          echo "deploy-environment=$env_name" >> "$GITHUB_OUTPUT"

      - name: Export deploy environment
        run: echo "DEPLOY_ENV=${{ steps.determine-environment.outputs.deploy-environment }}" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store and node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            cdk/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Build client
        run: pnpm client:build

      - name: Build CDK workspace
        run: pnpm --filter @jobseek/cdk build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.deploy-environment }}
    environment:
      name: ${{ needs.build.outputs.deploy-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache pnpm store and node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            cdk/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download client build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842434829012:role/github-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy infrastructure
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          SKIP_CLIENT_BUILD: "true"
        run: pnpm --filter @jobseek/cdk deploy:${{ needs.build.outputs.deploy-environment }} -- --non-interactive
